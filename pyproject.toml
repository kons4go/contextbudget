[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kons4go-contextbudget"
version = "0.1.0"
description = "按片段统计上下文的 token 占用，标出超预算的部分与可裁剪的低价值片段。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kons4go" }]
keywords = ["context", "tokens", "llm", "budget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kons4go.github.io"
Repository = "https://github.com/kons4go/contextbudget"
Issues = "https://github.com/kons4go/contextbudget/issues"

[project.scripts]
contextbudget = "contextbudget:main"

[tool.setuptools]
py-modules = ["contextbudget"]
